set -g default-terminal "screen-256color"
set -sg escape-time 0
set -g focus-events 1
set -g mouse on

# Catppuccin theme; the plugin itself is pinned in .chezmoiexternal.toml.
# Options must be set before the run line.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_host_text " #h"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Window accent follows the agent-watch state (see below): yellow = unseen
# output, bright green = freshly finished, dim green = finished a while
# ago, default = read. The stale color is a literal (a dimmed @thm_green)
# because option values aren't re-expanded, so it can't reference @thm_*.
set -g @agent_stale_color "#7fae7c"
set -g @catppuccin_window_number_color "#{?#{==:#{@agent_state},done},#{@thm_green},#{?#{==:#{@agent_state},stale},#{@agent_stale_color},#{?#{==:#{@agent_state},active},#{@thm_yellow},#{@thm_overlay_2}}}}"
run "$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right-length 100
# load needs -F: its #() is literal-protected and must be expanded into
# status-right at set time for tmux to execute it.
set -gF status-right "#{E:@catppuccin_status_load}"
set -ag status-right "#{E:@catppuccin_status_host}"

# Agent window watch: ~/bin/tmux-agent-watch, polled from status-right,
# maintains @agent_state per window running one of these binaries. tmux's
# activity flag supplies the "seen" semantics; the alert itself is muted
# (activity-action none) since the script rings its own bell on 'done'.
set -g @agent_watch_cmds 'claude.exe|codex|opencode'
set -g @agent_idle_seconds 60
set -g @agent_fresh_seconds 60
set -g @agent_grace_seconds 2
set -g @agent_bell on
# TUIs redraw when sent focus-out; stamp the moment we leave a window so
# the watcher can tell that blip from real activity.
set-hook -g pane-focus-out { run-shell -b "tmux set -w -t '#{window_id}' @agent_seen $(date +%s)" }
set -g status-interval 5
set -g activity-action none
set -g window-status-activity-style none
set -ag status-right "#(~/bin/tmux-agent-watch '#{socket_path}')"
